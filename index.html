<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>HIGHWAY RUSH • 2D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#fff;font-family:Arial,sans-serif}
body{touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#app{position:relative;width:100%;height:100%;overflow:hidden;background: radial-gradient(circle at 20% 10%,rgba(0,180,255,.12),transparent 32%), radial-gradient(circle at 80% 75%,rgba(255,60,120,.10),transparent 30%), #07111f}
canvas{position:absolute;inset:0;width:100%;height:100%}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.hidden{display:none!important}
.panel{ width:min(94vw,520px);padding:26px 20px 22px;border:1px solid rgba(255,255,255,.11); border-radius:28px;background:rgba(4,10,20,.82);backdrop-filter:blur(16px); box-shadow:0 18px 70px rgba(0,0,0,.45) }
.logo{font-size:clamp(40px,12vw,74px);font-weight:1000;letter-spacing:-2px;text-align:center;line-height:.9}
.logo span{display:block;font-size:.26em;letter-spacing:4px;opacity:.65;margin-top:10px}
.subtitle{text-align:center;color:#b9c8d9;margin:18px 0 22px;line-height:1.7}
.primary{ width:100%;padding:16px 18px;border-radius:18px;font-size:20px;font-weight:900; background:linear-gradient(135deg,#18d67b,#00a6ff);box-shadow:0 12px 28px rgba(0,180,255,.22) }
.secondary{ width:100%;padding:13px 16px;border-radius:16px;font-size:17px;font-weight:800; background:rgba(255,255,255,.08);margin-top:11px }
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mini-card{padding:15px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.mini-card b{display:block;font-size:22px;margin-bottom:6px}
.mini-card span{color:#aab7c6;font-size:13px;line-height:1.5}

.topbar{
  position:absolute;z-index:10;top:max(12px,env(safe-area-inset-top));left:10px;right:10px;
  display:flex;align-items:center;gap:8px;justify-content:space-between;pointer-events:none
}
.hud{display:flex;gap:7px;flex-wrap:wrap;align-items:center;width:100%;justify-content:space-between}
.badge{
  min-width:80px;padding:9px 11px;border-radius:15px;background:rgba(4,10,20,.72);
  border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(12px);text-align:center
}
.badge small{display:block;color:#8ea0b5;font-size:10px;margin-bottom:2px}
.badge strong{font-size:17px}
.icon-btn{
  pointer-events:auto;width:46px;height:46px;border-radius:15px;background:rgba(4,10,20,.72);
  border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(12px);font-size:21px
}

/* ================== الزراير: الأماكن معكوسة (الوظائف زي ما هي) ================== */
.controls{
  position:absolute;z-index:12;left:12px;right:12px;bottom:max(18px,calc(env(safe-area-inset-bottom) + 12px));
  display:flex;justify-content:space-between;align-items:end;pointer-events:none;
  direction:ltr; /* عشان ترتيب المجموعات يبقى مظبوط بعد العكس */
}
.control-group{display:flex;gap:10px;pointer-events:auto}
.ctl{
  width:68px;height:68px;border-radius:22px;background:rgba(4,10,20,.78);
  border:1px solid rgba(255,255,255,.12);box-shadow:0 12px 30px rgba(0,0,0,.28);
  font-size:29px;font-weight:900;user-select:none
}
.ctl:active{transform:scale(.94)}
.fire{
  width:82px;height:68px;border-radius:22px;background:linear-gradient(135deg,#ff486a,#ff8b31);
  font-size:18px
}

.shop-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.tab{padding:11px 8px;border-radius:14px;background:rgba(255,255,255,.05);font-weight:900}
.tab.active{background:rgba(0,170,255,.18);border:1px solid rgba(0,170,255,.35)}
.items{display:grid;gap:10px;max-height:46vh;overflow:auto;padding-right:2px}
.item{
  display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:12px;
  padding:12px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)
}
.item-icon{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:rgba(255,255,255,.07)}
.item h3{margin:0 0 5px;font-size:17px}
.item p{margin:0;color:#93a4b8;font-size:12px;line-height:1.45}
.buy{
  padding:10px 12px;border-radius:14px;background:#10c96f;font-weight:900;min-width:78px
}
.buy.locked{background:#2f4052;color:#9fb0c0}
.close{margin-top:12px}

.stats{display:flex;justify-content:center;gap:22px;margin:12px 0 18px}
.stat{text-align:center}
.stat b{display:block;font-size:28px}
.stat span{font-size:11px;color:#97a7ba}

.toast{
  position:absolute;z-index:30;left:50%;top:72px;transform:translateX(-50%) translateY(-16px);
  padding:10px 15px;border-radius:14px;background:rgba(5,11,19,.86);border:1px solid rgba(255,255,255,.1);
  opacity:0;transition:.24s;pointer-events:none;font-weight:800;white-space:nowrap
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.developer-bar{
  position:absolute;left:18px;right:18px;bottom:8px;z-index:40;height:58px;border-radius:22px;
  display:flex;align-items:center;gap:9px;padding:5px 8px;background:rgba(7,11,21,.92);
  border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(14px);
  box-shadow:0 10px 30px rgba(0,0,0,.30)
}
.developer-bar.game-hidden{display:none!important}
.developer-avatar{
  width:44px;height:44px;min-width:44px;border-radius:50%;display:grid;place-items:center;
  font-weight:1000;font-size:20px;background:linear-gradient(145deg,#17de77,#1aa7ff);
  box-shadow:0 0 25px rgba(20,210,120,.18)
}
.developer-info{flex:1;text-align:right}
.developer-label{font-size:11px;color:#8c9bad}
.developer-name{font-size:15px;font-weight:1000}
.developer-name span{color:#17de77}
.developer-wa{display:flex;align-items:center;justify-content:center;padding:9px 12px;border-radius:13px;background:#15cf72;color:#fff;text-decoration:none;font-weight:1000;font-size:13px}

.center-message{
  position:absolute;z-index:14;left:50%;top:50%;transform:translate(-50%,-50%);
  padding:24px 30px;border-radius:24px;background:rgba(5,10,18,.86);border:1px solid rgba(255,255,255,.1);
  text-align:center;display:none;min-width:260px
}
.center-message.show{display:block}
.center-message h2{margin:0 0 8px;font-size:34px}
.center-message p{margin:0;color:#aab7c8;line-height:1.7}

@media(min-width:800px){
  .controls{left:28px;right:28px}.ctl{width:76px;height:76px}.fire{width:94px}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- ===== الشريط العلوي ===== -->
  <div class="topbar">
    <div class="hud hidden" id="hud">
