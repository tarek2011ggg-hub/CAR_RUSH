<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشغل الصوت والتحكم</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f2f5;
      margin: 0;
    }

    .player-card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      width: 320px;
    }

    /* حاوية الأزرار مرتبة أفقياً */
    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }

    button {
      padding: 12px 20px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background-color: #007bff;
      color: white;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #0056b3;
    }

    /* تصميم زر الخروج */
    #exitBtn {
      display: none; /* مخفي افتراضياً */
      width: 100%;
      margin-top: 20px;
      background-color: #dc3545;
    }

    #exitBtn:hover {
      background-color: #bd2130;
    }

    .status-text {
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <h3>مشغل التحكم</h3>
    
    <!-- عنصر الصوت -->
    <audio id="myAudio" controls style="width: 100%;">
      <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
      متصفحك لا يدعم تشغيل الصوت.
    </audio>

    <!-- الأزرار معكوسة المكان: اليمين (→) أصلح على اليسار والمكان أصبح → ثم || ثم ← -->
    <div class="controls">
      <!-- تم وضع زر التقديم/التالي أولاً لإظهاره جهة اليمين مع الحفاظ على وظيفته الأصلية (Next) -->
      <button id="nextBtn" title="التالي / تقديم">→</button>
      
      <!-- زر التوقف المؤقت -->
      <button id="pauseBtn" title="توقف مؤقت">||</button>
      
      <!-- تم وضع زر السابق أخيراً لإظهاره جهة اليسار مع الحفاظ على وظيفته الأصلية (Prev) -->
      <button id="prevBtn" title="السابق / ترجيع">←</button>
    </div>

    <!-- زر الخروج للصفحة الرئيسية (يظهر عند الضغط على ||) -->
    <button id="exitBtn">الخروج للقائمة الرئيسية</button>

    <div id="status" class="status-text"></div>
  </div>

  <script>
    // الحصول على عناصر الواجهة
    const audio = document.getElementById('myAudio');
    const pauseBtn = document.getElementById('pauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const exitBtn = document.getElementById('exitBtn');
    const status = document.getElementById('status');

    // 1. عند الضغط على زر التوقف المؤقت (||)
    pauseBtn.addEventListener('click', () => {
      // إيقاف الصوت مؤقتاً
      audio.pause();
      
      // تعلية الصوت إلى الحد الأقصى (1.0 = 100%)
      audio.volume = 1.0;
      
      // إظهار زر الخروج للقائمة الرئيسية
      exitBtn.style.display = 'block';

      status.innerText = "تم إيقاف الصوت، تعلية الصوت لـ 100%، وإظهار زر الخروج.";
    });

    // زر الخروج للصفحة الرئيسية
    exitBtn.addEventListener('click', () => {
      // يمكنك تغيير 'index.html' إلى رابط الصفحة الرئيسية المطلوبة
      window.location.href = 'index.html';
    });

    // 2. الاحتفاظ بالوظائف الأصلية للأزرار المعكوسة
    
    // زر (←) يؤدي وظيفة الترجيع / السابق الأصلية
    prevBtn.addEventListener('click', () => {
      audio.currentTime = Math.max(0, audio.currentTime - 5); // ترجيع 5 ثوانٍ
      status.innerText = "تم الترجيع للخلف (الوظيفة الأصلية لـ ←)";
    });

    // زر (→) يؤدي وظيفة التقديم / التالي الأصلية
    nextBtn.addEventListener('click', () => {
      audio.currentTime = Math.min(audio.duration, audio.currentTime + 5); // تقديم 5 ثوانٍ
      status.innerText = "تم التقديم للأمام (الوظيفة الأصلية لـ →)";
    });
  </script>

</body>
</html>
